<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>현용호 · 메디아 클래스</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --line: #e3e6ec;
      --accent: #2f6df6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      padding: 32px 16px 64px;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 14px;
      margin-bottom: 24px;
    }
    .back:hover { color: var(--accent); }
    .head {
      display: flex; align-items: center; gap: 16px;
      padding-bottom: 20px; border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 50%;
      background: #eef3ff; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; flex: none;
    }
    h1 { font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0; }

    /* ↓↓↓ 여기부터 자유롭게 수정하세요 ↓↓↓ */
    .cal, .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    .cal-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .cal-title { font-size: 22px; font-weight: 700; margin: 0; }
    .cal-nav { display: flex; gap: 6px; }
    .btn {
      border: 1px solid var(--line); background: var(--card); color: var(--text);
      border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { color: #fff; opacity: .9; }

    .week, .days {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    }
    .week div {
      text-align: center; font-size: 13px; color: var(--muted);
      padding: 6px 0; font-weight: 600;
    }
    .week div:first-child, .day.sun .num { color: #e5484d; }
    .week div:last-child, .day.sat .num { color: #2f6df6; }
    .days { border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .day {
      min-height: 96px; padding: 6px;
      border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
      cursor: pointer; display: flex; flex-direction: column; gap: 3px;
      background: var(--card); text-align: left; font: inherit; color: inherit;
      border-top: 0; border-left: 0; min-width: 0;
    }
    .day:hover { background: #f8faff; }
    .day.other { background: #fafbfc; }
    .day.other .num { opacity: .4; }
    .day.selected { box-shadow: inset 0 0 0 2px var(--accent); }
    .num {
      font-size: 13px; font-weight: 600; width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%;
    }
    .day.today .num {
      background: #fdecec; color: #e5484d !important;
      font-size: 17px; font-weight: 800; width: 32px; height: 32px;
    }
    .chip {
      font-size: 12px; line-height: 1.3; padding: 2px 6px; border-radius: 4px;
      background: #fdecec; color: #e5484d;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .more { font-size: 11px; color: var(--muted); padding-left: 4px; }
    .day.holiday .num { color: #e5484d; }
    .hol-name {
      font-size: 11px; color: #e5484d; font-weight: 600; line-height: 1.2;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .filter-note {
      margin: -6px 0 12px; font-size: 13px; color: var(--accent);
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .filter-note[hidden] { display: none; }
    .linkbtn {
      border: 0; background: none; color: var(--muted); cursor: pointer;
      font: inherit; font-size: 13px; text-decoration: underline; padding: 0;
    }

    .panel {
      margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line);
    }
    .panel h2, .card h2 { font-size: 17px; margin: 0 0 12px; }
    .form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .form input, .form select {
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 14px; color: var(--text); background: #fff;
      min-width: 0;
    }
    .form input:focus, .form select:focus { outline: 2px solid #c7d7fe; border-color: var(--accent); }
    .form #date { flex: 0 1 150px; }
    .form #time { flex: 0 1 120px; }
    .form #hosp { flex: 1 1 200px; }
    .form #leave { flex: 0 1 150px; }
    .form #text, .form #memo { flex: 1 1 100%; }
    .form #repeat { flex: 0 1 130px; }
    .form #until { flex: 0 1 150px; }
    .form .until-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .form .until-wrap[hidden] { display: none; }
    .form .actions { display: flex; gap: 6px; margin-left: auto; }
    .form.editing { background: #f8faff; border-radius: 10px; padding: 10px; outline: 1px solid #c7d7fe; }
    .edit-label { flex: 1 1 100%; font-size: 13px; color: var(--accent); font-weight: 600; }
    .edit-label[hidden] { display: none; }

    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    }
    .item .time { font-size: 13px; color: var(--accent); font-weight: 600; min-width: 44px; padding-top: 2px; }
    .item .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .item .text { color: #e5484d; font-weight: 600; }
    /* 오프·연차는 업무일정(빨강)과 구분되게 초록색 */
    .chip.leave { background: #e6f6ec; color: #18794e; }
    .item .text.leave { color: #18794e; }
    .item .addr { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; }
    .item .addr a { color: var(--muted); }
    .item .addr a:hover { color: var(--accent); }
    .item .addr .map { margin-left: 6px; font-size: 11px; }
    .item .memo {
      display: block; font-size: 13px; color: var(--text); margin-top: 4px;
      white-space: pre-wrap; font-weight: 400;
    }
    .badge {
      display: inline-block; font-size: 11px; color: var(--accent); background: #eef3ff;
      border-radius: 4px; padding: 1px 5px; margin-left: 6px; font-weight: 600; vertical-align: middle;
    }
    .item .ops { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .op {
      border: 0; background: none; color: var(--muted); cursor: pointer;
      font: inherit; font-size: 13px; padding: 3px 8px; border-radius: 6px; white-space: nowrap;
    }
    .op:hover { background: #eef3ff; color: var(--accent); }
    .op.del:hover { background: #fdecec; color: #e5484d; }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }

    .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .tools .wide { grid-column: 1 / -1; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: var(--bg); border-radius: 10px; padding: 10px; }
    .stat b { display: block; font-size: 20px; }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat.red b { color: #e5484d; }
    .stat.green b { color: #18794e; }
    .rows { list-style: none; margin: 0; padding: 0; font-size: 14px; }
    .rows li {
      display: flex; justify-content: space-between; gap: 8px;
      padding: 6px 0; border-bottom: 1px solid var(--line);
    }
    .rows li:last-child { border-bottom: 0; }
    .rows .go {
      border: 0; background: none; color: var(--text); cursor: pointer; font: inherit;
      text-align: left; padding: 0;
    }
    .rows .go:hover { color: var(--accent); }
    .rows .dim { color: var(--muted); }
    .leave-set { display: flex; align-items: center; gap: 6px; font-size: 14px; flex-wrap: wrap; margin-top: 12px; }
    .leave-set input {
      width: 70px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit;
    }
    .card select {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      font: inherit; font-size: 14px; margin-bottom: 12px; background: #fff;
    }
    .card p.help { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
    .backup-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .msg { font-size: 13px; margin-top: 10px; color: #18794e; }
    .msg.err { color: #e5484d; }

    @media (max-width: 600px) {
      .cal, .card { padding: 12px; }
      .day { min-height: 56px; padding: 3px; align-items: center; }
      .chip, .more, .hol-name { display: none; }
      .day.has::after {
        content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      }
      .tools { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .form .actions { margin-left: 0; flex: 1 1 100%; }
      .form .actions .btn { flex: 1; }
    }
    /* ↑↑↑ 여기까지 ↑↑↑ */
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← 전체 목록으로</a>

    <div class="head">
      <div class="avatar">현</div>
      <div>
        <h1>현용호</h1>
        <p class="sub">메디아 개원팀 · 나만의 페이지</p>
      </div>
    </div>

    <!-- ↓↓↓ 여기부터 원하는 결과물을 만들어 보세요 ↓↓↓ -->
    <section class="cal">
      <div class="cal-top">
        <h2 class="cal-title" id="title"></h2>
        <div class="cal-nav">
          <button class="btn" id="prev" aria-label="이전 달">‹ 이전</button>
          <button class="btn" id="today">오늘</button>
          <button class="btn" id="next" aria-label="다음 달">다음 ›</button>
        </div>
      </div>
      <p class="filter-note" id="filterNote" hidden>
        <span id="filterText"></span>
        <button class="linkbtn" id="filterClear" type="button">전체 보기</button>
      </p>

      <div class="week">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div class="days" id="days"></div>

      <div class="panel">
        <h2 id="selTitle"></h2>
        <form class="form" id="form">
          <div class="edit-label" id="editLabel" hidden>✏️ 일정 수정 중</div>
          <input type="date" id="date" aria-label="날짜" required>
          <input type="time" id="time" aria-label="시간 (선택)">
          <select id="hosp" aria-label="병원 선택">
            <option value="">병원 선택</option>
          </select>
          <select id="leave" aria-label="오프 · 연차 선택">
            <option value="">오프 · 연차 선택</option>
          </select>
          <input type="text" id="text" placeholder="업무 일정을 입력하세요" maxlength="100">
          <input type="text" id="memo" placeholder="메모 (담당자, 연락처, 방문 목적 등)" maxlength="300">
          <select id="repeat" aria-label="반복">
            <option value="">반복 안 함</option>
            <option value="week">매주 반복</option>
            <option value="month">매월 반복</option>
          </select>
          <label class="until-wrap" id="untilWrap" hidden>
            종료일 <input type="date" id="until">
          </label>
          <div class="actions">
            <button class="btn" type="button" id="cancelEdit" hidden>취소</button>
            <button class="btn btn-primary" type="submit" id="submitBtn">추가</button>
          </div>
        </form>
        <ul class="list" id="list"></ul>
      </div>
    </section>

    <div class="tools">
      <section class="card">
        <h2 id="sumTitle">월간 요약</h2>
        <div class="stats">
          <div class="stat red"><b id="sWork">0</b><span>업무 일정</span></div>
          <div class="stat red"><b id="sHosp">0</b><span>병원 방문</span></div>
          <div class="stat green"><b id="sOff">0</b><span>오프</span></div>
          <div class="stat green"><b id="sLeave">0</b><span>연차</span></div>
        </div>
        <ul class="rows" id="sumRows"></ul>
        <div class="leave-set">
          <span id="leaveYearLabel">올해 연차</span>
          <input type="number" id="annual" min="0" max="365" step="0.5" aria-label="연차 총 일수">
          <span>일 중</span>
          <b id="leaveLeft">-</b>
        </div>
      </section>

      <section class="card">
        <h2>병원별 보기</h2>
        <select id="hospFilter" aria-label="병원별 보기">
          <option value="">병원을 선택하세요</option>
        </select>
        <ul class="rows" id="hospRows"><li class="dim">병원을 고르면 방문 일정이 모두 나옵니다.</li></ul>
      </section>

      <section class="card wide">
        <h2>백업</h2>
        <p class="help">일정은 이 브라우저에만 저장됩니다. 가끔 백업 파일로 저장해 두고, 다른 PC나 브라우저에서는 그 파일을 불러오면 됩니다. 불러오면 기존 일정은 그대로 두고 없는 일정만 더해집니다.</p>
        <div class="backup-btns">
          <button class="btn" type="button" id="exportBtn">⬇ 백업 파일 저장</button>
          <button class="btn" type="button" id="importBtn">⬆ 백업 파일 불러오기</button>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
        </div>
        <div class="msg" id="backupMsg"></div>
      </section>
    </div>

    <script>
      const KEY = 'hyun-yongho-calendar';
      const LEAVE_KEY = 'hyun-yongho-annual-leave';
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };

      // 메디아 스케쥴 병원 목록 — 번호 순서대로 아래에 추가하세요
      const HOSPITALS = [
        { name: '더포스타365정형외과', addr: '인천시 계양구 계산새로 61' },          // 1번
        { name: '성복바로척의원', addr: '경기도 용인시 수지구 성복2로 38' },          // 2번
        { name: '원본재활의학과의원', addr: '서울 강북구 도봉로 48' },                // 3번
        { name: '연세본튼튼의원', addr: '경기도 파주시 금빛로 24' },                  // 4번
        { name: '고려마디탄탄의원', addr: '인천 미추홀구 염창로 51' },                // 5번
        { name: '서울올림정형외과의원', addr: '서울 송파구 올림픽로35길 45' },        // 6번
        { name: '일산베스트신경외과의원', addr: '경기 고양시 일산서구 고양대로 734' }, // 7번
        { name: '이천터미널마취통증의학과', addr: '경기 이천시 이섭대천로 1203' },     // 8번
      ];
      // 오프·연차 목록 — 필요하면 아래에 추가하세요 (예: '반차')
      const LEAVES = ['오프', '연차'];

      function fill(selectId, labels) {
        labels.forEach((label, i) => {
          const o = el('option', '', label);
          o.value = i;
          $(selectId).appendChild(o);
        });
      }
      fill('hosp', HOSPITALS.map((h, i) => `${i + 1}. ${h.name}`));
      fill('leave', LEAVES);
      fill('hospFilter', HOSPITALS.map((h, i) => `${i + 1}. ${h.name}`));

      // 선택한 항목 → { name, addr, leave } (두 목록 중 하나만 선택됨)
      function picked() {
        if ($('hosp').value !== '') return HOSPITALS[$('hosp').value];
        if ($('leave').value !== '') return { name: LEAVES[$('leave').value], leave: true };
        return null;
      }
      $('hosp').addEventListener('change', () => {
        $('leave').value = '';
        const p = picked();
        $('text').value = p ? p.name : '';
      });
      $('leave').addEventListener('change', () => {
        $('hosp').value = '';
        const p = picked();
        $('text').value = p ? p.name : '';
      });

      // 공휴일 — 음력 명절·대체공휴일·선거일은 연도별로 직접 적어야 합니다
      const HOLIDAYS_BY_YEAR = {
        2025: {
          '01-27': '임시공휴일', '01-28': '설날 연휴', '01-29': '설날', '01-30': '설날 연휴',
          '03-03': '대체공휴일', '05-05': '어린이날·부처님오신날', '05-06': '대체공휴일',
          '06-03': '대통령선거일', '10-05': '추석 연휴', '10-06': '추석', '10-07': '추석 연휴',
          '10-08': '대체공휴일',
        },
        2026: {
          '02-16': '설날 연휴', '02-17': '설날', '02-18': '설날 연휴', '03-02': '대체공휴일',
          '05-24': '부처님오신날', '05-25': '대체공휴일', '06-03': '지방선거일',
          '08-17': '대체공휴일', '09-24': '추석 연휴', '09-25': '추석', '09-26': '추석 연휴',
          '10-05': '대체공휴일',
        },
        2027: {
          '02-06': '설날 연휴', '02-07': '설날', '02-08': '설날 연휴', '02-09': '대체공휴일',
          '05-03': '대체공휴일', '05-13': '부처님오신날', '07-19': '대체공휴일',
          '08-16': '대체공휴일', '09-14': '추석 연휴', '09-15': '추석', '09-16': '추석 연휴',
          '10-04': '대체공휴일', '10-11': '대체공휴일', '12-27': '대체공휴일',
        },
      };
      // 매년 날짜가 같은 공휴일 (노동절·제헌절은 2026년부터)
      function fixedHolidays(y) {
        const f = {
          '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일',
          '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절',
        };
        if (y >= 2026) { f['05-01'] = '노동절'; f['07-17'] = '제헌절'; }
        return f;
      }
      function holidayOf(k) {
        const y = Number(k.slice(0, 4)), md = k.slice(5);
        return (HOLIDAYS_BY_YEAR[y] || {})[md] || fixedHolidays(y)[md] || '';
      }

      // 일정 저장소: { "2026-11-10": [{ id, time, text, memo, hosp, addr, leave, rid }], ... }
      //   hosp: 병원 이름 / leave: true면 오프·연차 / rid: 같은 반복 일정끼리 같은 값
      const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

      function normalize(ev) {
        // 예전에 저장한 일정에 병원 이름 채우기
        if (ev.addr && !ev.hosp) {
          const h = HOSPITALS.find((x) => x.addr === ev.addr);
          if (h) ev.hosp = h.name;
        }
        return ev;
      }
      function cleanEvents(obj) {
        const out = {};
        if (!obj || typeof obj !== 'object') return out;
        Object.keys(obj).forEach((k) => {
          if (!DATE_RE.test(k) || !Array.isArray(obj[k])) return;
          const list = obj[k].filter((ev) => ev && typeof ev.text === 'string' && ev.text.trim())
            .map((ev) => normalize({
              id: String(ev.id || uid()),
              time: typeof ev.time === 'string' ? ev.time : '',
              text: ev.text.trim(),
              memo: typeof ev.memo === 'string' ? ev.memo : '',
              hosp: typeof ev.hosp === 'string' ? ev.hosp : '',
              addr: typeof ev.addr === 'string' ? ev.addr : '',
              leave: !!ev.leave,
              rid: ev.rid ? String(ev.rid) : '',
            }));
          if (list.length) out[k] = list;
        });
        return out;
      }

      let events = {};
      try { events = cleanEvents(JSON.parse(localStorage.getItem(KEY))); } catch (e) { events = {}; }
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(events)); } catch (e) {}
      }
      let annualLeave = '';
      try { annualLeave = localStorage.getItem(LEAVE_KEY) || ''; } catch (e) {}

      const pad = (n) => String(n).padStart(2, '0');
      const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
      const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
      const DOW = '일월화수목금토';
      const now = new Date();
      let view = new Date(now.getFullYear(), now.getMonth(), 1); // 보고 있는 달
      let selected = keyOf(now);                                // 선택한 날짜
      let editing = null;                                       // { key, id } 수정 중인 일정
      let filterHosp = '';                                      // 병원별 보기에서 고른 병원

      function sorted(list) {
        return [...list].sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
      }
      const shown = (ev) => !filterHosp || ev.hosp === filterHosp;

      /* ---------- 달력 ---------- */
      function renderMonth() {
        const y = view.getFullYear(), m = view.getMonth();
        $('title').textContent = `${y}년 ${m + 1}월`;
        const start = new Date(y, m, 1 - new Date(y, m, 1).getDay()); // 첫 주 일요일
        const weeks = Math.ceil((new Date(y, m, 1).getDay() + new Date(y, m + 1, 0).getDate()) / 7);
        const box = $('days');
        box.innerHTML = '';

        $('filterNote').hidden = !filterHosp;
        $('filterText').textContent = filterHosp ? `‘${filterHosp}’ 일정만 보는 중` : '';

        for (let i = 0; i < weeks * 7; i++) {
          const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
          const k = keyOf(d);
          const list = sorted(events[k] || []).filter(shown);
          const cell = el('button', 'day');
          cell.type = 'button';
          if (d.getMonth() !== m) cell.classList.add('other');
          if (d.getDay() === 0) cell.classList.add('sun');
          if (d.getDay() === 6) cell.classList.add('sat');
          if (k === keyOf(now)) cell.classList.add('today');
          if (k === selected) cell.classList.add('selected');
          if (list.length) cell.classList.add('has');

          cell.appendChild(el('span', 'num', d.getDate()));

          const hol = holidayOf(k);
          if (hol) {
            cell.classList.add('holiday');
            cell.appendChild(el('div', 'hol-name', hol));
          }

          list.slice(0, 3).forEach((ev) => {
            cell.appendChild(el('div', ev.leave ? 'chip leave' : 'chip', (ev.time ? ev.time + ' ' : '') + ev.text));
          });
          if (list.length > 3) cell.appendChild(el('div', 'more', `+${list.length - 3}개 더`));

          cell.addEventListener('click', () => selectDate(k));
          box.appendChild(cell);
        }
      }

      function selectDate(k) {
        selected = k;
        const d = parseKey(k);
        view = new Date(d.getFullYear(), d.getMonth(), 1);
        if (!editing) $('date').value = k;
        render();
      }

      /* ---------- 선택한 날의 일정 ---------- */
      function mapLinks(addr) {
        const span = el('span', 'addr');
        const a = el('a', '', '📍 ' + addr);
        a.href = 'https://map.naver.com/p/search/' + encodeURIComponent(addr);
        a.target = '_blank'; a.rel = 'noopener';
        a.title = '네이버지도에서 열기';
        const k = el('a', 'map', '카카오맵');
        k.href = 'https://map.kakao.com/link/search/' + encodeURIComponent(addr);
        k.target = '_blank'; k.rel = 'noopener';
        span.append(a, k);
        return span;
      }

      function renderPanel() {
        const d = parseKey(selected);
        const hol = holidayOf(selected);
        $('selTitle').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})${hol ? ' · ' + hol : ''} 일정`;
        const ul = $('list');
        ul.innerHTML = '';
        const list = sorted(events[selected] || []);
        if (!list.length) {
          ul.appendChild(el('li', 'empty', '등록된 일정이 없습니다.'));
          return;
        }
        list.forEach((ev) => {
          const li = el('li', 'item');
          const body = el('div', 'body');
          const tx = el('span', ev.leave ? 'text leave' : 'text', ev.text);
          body.appendChild(tx);
          if (ev.rid) body.appendChild(el('span', 'badge', '반복'));
          if (ev.addr) body.appendChild(mapLinks(ev.addr));
          if (ev.memo) body.appendChild(el('span', 'memo', '📝 ' + ev.memo));

          const ops = el('div', 'ops');
          const edit = el('button', 'op', '수정');
          edit.type = 'button';
          edit.addEventListener('click', () => startEdit(selected, ev));
          const del = el('button', 'op del', '삭제');
          del.type = 'button';
          del.addEventListener('click', () => {
            removeEvent(selected, ev.id);
            save(); render();
          });
          ops.append(edit, del);
          if (ev.rid) {
            const delAll = el('button', 'op del', '반복 전체 삭제');
            delAll.type = 'button';
            delAll.addEventListener('click', () => {
              const n = countRepeat(ev.rid);
              if (!confirm(`‘${ev.text}’ 반복 일정 ${n}개를 모두 삭제할까요?`)) return;
              Object.keys(events).forEach((k) => {
                events[k] = events[k].filter((x) => x.rid !== ev.rid);
                if (!events[k].length) delete events[k];
              });
              save(); render();
            });
            ops.appendChild(delAll);
          }
          li.append(el('span', 'time', ev.time || '종일'), body, ops);
          ul.appendChild(li);
        });
      }

      function removeEvent(k, id) {
        if (!events[k]) return null;
        const ev = events[k].find((x) => x.id === id);
        events[k] = events[k].filter((x) => x.id !== id);
        if (!events[k].length) delete events[k];
        return ev;
      }
      function countRepeat(rid) {
        return Object.values(events).reduce((n, l) => n + l.filter((x) => x.rid === rid).length, 0);
      }

      /* ---------- 추가 · 수정 ---------- */
      function resetForm() {
        editing = null;
        $('form').reset();
        $('form').classList.remove('editing');
        $('editLabel').hidden = true;
        $('cancelEdit').hidden = true;
        $('submitBtn').textContent = '추가';
        $('repeat').disabled = false;
        $('untilWrap').hidden = true;
        $('date').value = selected;
      }

      function startEdit(k, ev) {
        editing = { key: k, id: ev.id };
        $('form').classList.add('editing');
        $('editLabel').hidden = false;
        $('cancelEdit').hidden = false;
        $('submitBtn').textContent = '저장';
        $('date').value = k;
        $('time').value = ev.time || '';
        const hi = HOSPITALS.findIndex((h) => h.name === ev.hosp);
        $('hosp').value = hi >= 0 ? hi : '';
        const li = ev.leave ? LEAVES.indexOf(ev.text) : -1;
        $('leave').value = li >= 0 ? li : '';
        $('text').value = ev.text;
        $('memo').value = ev.memo || '';
        $('repeat').value = '';
        $('repeat').disabled = true; // 수정은 이 날짜 일정만
        $('untilWrap').hidden = true;
        $('form').scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('text').focus();
      }
      $('cancelEdit').addEventListener('click', resetForm);

      $('repeat').addEventListener('change', () => {
        const on = !!$('repeat').value;
        $('untilWrap').hidden = !on;
        if (on && !$('until').value) {
          const d = parseKey($('date').value || selected);
          $('until').value = keyOf(new Date(d.getFullYear(), d.getMonth() + 3, d.getDate()));
        }
      });

      // 반복 날짜 목록 (매월 31일처럼 없는 날은 건너뜀)
      function repeatDates(startKey, kind, untilKey) {
        const s = parseKey(startKey), end = parseKey(untilKey), out = [];
        for (let i = 0; out.length < 200; i++) {
          let d;
          if (kind === 'week') d = new Date(s.getFullYear(), s.getMonth(), s.getDate() + 7 * i);
          else {
            d = new Date(s.getFullYear(), s.getMonth() + i, s.getDate());
            if (d.getDate() !== s.getDate()) { if (d > end) break; continue; }
          }
          if (d > end) break;
          out.push(keyOf(d));
        }
        return out;
      }

      $('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const text = $('text').value.trim();
        if (!text) { $('text').focus(); return; }
        const date = DATE_RE.test($('date').value) ? $('date').value : selected;
        const p = picked();
        const base = {
          time: $('time').value,
          text,
          memo: $('memo').value.trim(),
          hosp: p && !p.leave ? p.name : '',
          addr: p && p.addr ? p.addr : '',
          leave: !!(p && p.leave),
        };

        if (editing) {
          const old = removeEvent(editing.key, editing.id) || {};
          (events[date] = events[date] || []).push({ ...base, id: editing.id, rid: old.rid || '' });
        } else if ($('repeat').value) {
          const until = DATE_RE.test($('until').value) ? $('until').value : date;
          if (until < date) { alert('종료일이 시작일보다 빠릅니다.'); return; }
          const rid = uid();
          repeatDates(date, $('repeat').value, until).forEach((k) => {
            (events[k] = events[k] || []).push({ ...base, id: uid(), rid });
          });
        } else {
          (events[date] = events[date] || []).push({ ...base, id: uid(), rid: '' });
        }
        save();
        selected = date;
        const d = parseKey(date);
        view = new Date(d.getFullYear(), d.getMonth(), 1);
        resetForm();
        render();
      });

      /* ---------- 월간 요약 ---------- */
      function renderSummary() {
        const y = view.getFullYear(), m = view.getMonth();
        const prefix = `${y}-${pad(m + 1)}-`;
        $('sumTitle').textContent = `${m + 1}월 요약`;
        let work = 0, hosp = 0, off = 0, leave = 0;
        const byHosp = {};
        Object.keys(events).forEach((k) => {
          if (!k.startsWith(prefix)) return;
          events[k].forEach((ev) => {
            if (ev.leave) {
              if (ev.text === '오프') off++;
              else if (ev.text === '연차') leave++;
            } else {
              work++;
              if (ev.hosp) { hosp++; byHosp[ev.hosp] = (byHosp[ev.hosp] || 0) + 1; }
            }
          });
        });
        $('sWork').textContent = work;
        $('sHosp').textContent = hosp;
        $('sOff').textContent = off;
        $('sLeave').textContent = leave;

        const rows = $('sumRows');
        rows.innerHTML = '';
        const names = Object.keys(byHosp).sort((a, b) => byHosp[b] - byHosp[a]);
        if (!names.length) rows.appendChild(el('li', 'dim', '이번 달 병원 방문 일정이 없습니다.'));
        names.forEach((n) => {
          const li = el('li');
          const go = el('button', 'go', n);
          go.type = 'button';
          go.addEventListener('click', () => { $('hospFilter').value = HOSPITALS.findIndex((h) => h.name === n); applyFilter(); });
          li.append(go, el('span', 'dim', `${byHosp[n]}회`));
          rows.appendChild(li);
        });

        // 연차: 보고 있는 해에 쓴 연차 수
        let usedYear = 0;
        Object.keys(events).forEach((k) => {
          if (k.startsWith(`${y}-`)) usedYear += events[k].filter((ev) => ev.leave && ev.text === '연차').length;
        });
        $('leaveYearLabel').textContent = `${y}년 연차`;
        if (document.activeElement !== $('annual')) $('annual').value = annualLeave;
        const total = parseFloat(annualLeave);
        $('leaveLeft').textContent = isNaN(total)
          ? `사용 ${usedYear}일 (총 일수를 입력하면 남은 연차가 나옵니다)`
          : `사용 ${usedYear}일 · 남은 연차 ${total - usedYear}일`;
      }
      $('annual').addEventListener('input', () => {
        annualLeave = $('annual').value;
        try { localStorage.setItem(LEAVE_KEY, annualLeave); } catch (e) {}
        renderSummary();
      });

      /* ---------- 병원별 보기 ---------- */
      function applyFilter() {
        const i = $('hospFilter').value;
        filterHosp = i === '' ? '' : HOSPITALS[i].name;
        render();
      }
      $('hospFilter').addEventListener('change', applyFilter);
      $('filterClear').addEventListener('click', () => { $('hospFilter').value = ''; applyFilter(); });

      function renderHospList() {
        const rows = $('hospRows');
        rows.innerHTML = '';
        if (!filterHosp) {
          rows.appendChild(el('li', 'dim', '병원을 고르면 방문 일정이 모두 나옵니다.'));
          return;
        }
        const found = [];
        Object.keys(events).sort().forEach((k) => {
          sorted(events[k]).forEach((ev) => { if (ev.hosp === filterHosp) found.push([k, ev]); });
        });
        if (!found.length) {
          rows.appendChild(el('li', 'dim', '등록된 방문 일정이 없습니다.'));
          return;
        }
        const today = keyOf(now);
        found.forEach(([k, ev]) => {
          const d = parseKey(k);
          const li = el('li');
          const go = el('button', 'go', `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()} (${DOW[d.getDay()]})${ev.time ? ' ' + ev.time : ''}`);
          go.type = 'button';
          if (k < today) go.classList.add('dim');
          go.addEventListener('click', () => { selectDate(k); $('selTitle').scrollIntoView({ behavior: 'smooth', block: 'start' }); });
          li.append(go, el('span', 'dim', ev.memo ? ev.memo.slice(0, 20) : (k < today ? '지난 방문' : '예정')));
          rows.appendChild(li);
        });
      }

      /* ---------- 백업 ---------- */
      function backupMsg(text, err) {
        $('backupMsg').textContent = text;
        $('backupMsg').className = err ? 'msg err' : 'msg';
      }
      $('exportBtn').addEventListener('click', () => {
        const data = { app: 'hyun-yongho-calendar', version: 1, savedAt: new Date().toISOString(), annualLeave, events };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const a = el('a');
        a.href = URL.createObjectURL(blob);
        a.download = `현용호-캘린더-백업-${keyOf(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        const n = Object.values(events).reduce((s, l) => s + l.length, 0);
        backupMsg(`일정 ${n}개를 백업 파일로 저장했습니다.`);
      });
      $('importBtn').addEventListener('click', () => $('importFile').click());
      $('importFile').addEventListener('change', () => {
        const file = $('importFile').files[0];
        $('importFile').value = '';
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          let data;
          try { data = JSON.parse(reader.result); } catch (e) { backupMsg('백업 파일을 읽을 수 없습니다. 이 캘린더에서 저장한 파일인지 확인해 주세요.', true); return; }
          const incoming = cleanEvents(data && data.events ? data.events : data);
          let added = 0;
          Object.keys(incoming).forEach((k) => {
            const have = new Set((events[k] || []).map((x) => x.id));
            incoming[k].forEach((ev) => {
              if (have.has(ev.id)) return;
              (events[k] = events[k] || []).push(ev);
              added++;
            });
          });
          if (data && data.annualLeave !== undefined && annualLeave === '') {
            annualLeave = String(data.annualLeave);
            try { localStorage.setItem(LEAVE_KEY, annualLeave); } catch (e) {}
          }
          save(); render();
          backupMsg(added ? `일정 ${added}개를 불러왔습니다.` : '새로 더할 일정이 없습니다. (이미 모두 있음)');
        };
        reader.readAsText(file);
      });

      /* ---------- 공통 ---------- */
      function render() { renderMonth(); renderPanel(); renderSummary(); renderHospList(); }

      $('prev').addEventListener('click', () => {
        view = new Date(view.getFullYear(), view.getMonth() - 1, 1); renderMonth(); renderSummary();
      });
      $('next').addEventListener('click', () => {
        view = new Date(view.getFullYear(), view.getMonth() + 1, 1); renderMonth(); renderSummary();
      });
      $('today').addEventListener('click', () => selectDate(keyOf(now)));

      $('date').value = selected;
      render();
    </script>
    <!-- ↑↑↑ 여기까지 ↑↑↑ -->
  </div>
</body>
