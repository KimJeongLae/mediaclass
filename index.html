<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메디아 클래스</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --line: #e3e6ec;
      --accent: #2f6df6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { font-size: 32px; margin: 0 0 10px; letter-spacing: -0.5px; }
    .sub { color: var(--muted); font-size: 15px; margin: 0; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 880px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px rgba(47, 109, 246, .14);
    }
    .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #eef3ff;
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700;
    }
    .name { font-size: 19px; font-weight: 700; }
    .role { font-size: 13px; color: var(--muted); }
    footer { margin-top: 44px; font-size: 13px; color: var(--muted); }
    @media (max-width: 760px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>메디아 개원팀 코딩 클래스</h1>
    <p class="sub">이름을 클릭하면 각자의 작업 페이지로 이동합니다.</p>
  </header>

  <main class="grid">
    <a class="card" href="pages/eom-yoseph.html">
      <div class="avatar">엄</div>
      <div class="name">엄요셉</div>
      <div class="role">개원팀</div>
    </a>
    <a class="card" href="pages/hyun-yongho.html">
      <div class="avatar">현</div>
      <div class="name">현용호</div>
      <div class="role">개원팀</div>
    </a>
    <a class="card" href="pages/park-seonga.html">
      <div class="avatar">박</div>
      <div class="name">박성아</div>
      <div class="role">개원팀</div>
    </a>
    <a class="card" href="pages/yoo-seonghee.html">
      <div class="avatar">유</div>
      <div class="name">유성희</div>
      <div class="role">개원팀</div>
    </a>
  </main>

  <footer>메디아 컨설팅 · 코딩 교육 실습</footer>
</body>
</html>
